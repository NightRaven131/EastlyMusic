name: Build Eastly APK

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build from. Blank = latest release."
        required: false
        type: string
      source_asset:
        description: "Optional exact source ZIP asset name. Blank = auto-detect a source ZIP."
        required: false
        type: string
      title:
        description: "Release title. Used only when a tag is explicitly built/published."
        required: false
        type: string

permissions:
  contents: write

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "9.7.1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve source release, version, and release policy
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_TITLE: ${{ inputs.title }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          latest_release="$(gh release list \
            --repo "${GITHUB_REPOSITORY}" \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName // empty' || true)"

          publish=false
          source_tag=""
          target_tag=""

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            target_tag="${GITHUB_REF_NAME}"
            source_tag="${target_tag}"
            publish=true
          elif [[ -n "${INPUT_TAG}" ]]; then
            target_tag="${INPUT_TAG#refs/tags/}"
            [[ "${target_tag}" == v* ]] || target_tag="v${target_tag}"
            source_tag="${target_tag}"
            publish=true
          elif [[ -n "${latest_release}" ]]; then
            source_tag="${latest_release}"
          else
            echo "No release exists yet. Create a release with the source ZIP attached." >&2
            exit 1
          fi

          gh release view "${source_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || {
            echo "Release '${source_tag}' was not found." >&2
            exit 1
          }

          if [[ -n "${target_tag}" ]]; then
            version_name="${target_tag#v}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version_name="${source_tag#v}-main.${GITHUB_RUN_NUMBER}"
          else
            version_name="${source_tag#v}-rebuild.${GITHUB_RUN_NUMBER}"
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            channel=9
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            channel=5
          else
            channel=1
          fi

          version_code=$(( GITHUB_RUN_NUMBER * 10 + channel ))
          if (( version_code < 1 || version_code > 2147483647 )); then
            echo "Computed versionCode ${version_code} is outside Android's supported range." >&2
            exit 1
          fi

          release_title="${INPUT_TITLE:-}"
          if [[ -z "${release_title}" && -n "${target_tag}" ]]; then
            release_title="Eastly ${target_tag#v}"
          fi
          [[ -n "${release_title}" ]] || release_title="Eastly ${version_name}"

          {
            echo "source_tag=${source_tag}"
            echo "release_tag=${target_tag}"
            echo "version_name=${version_name}"
            echo "version_code=${version_code}"
            echo "publish=${publish}"
            echo "release_title<<EOF"
            echo "${release_title}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download and extract source from release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ steps.meta.outputs.source_tag }}
          SOURCE_ASSET: ${{ inputs.source_asset }}
        shell: bash
        run: |
          set -euo pipefail

          download_dir="$(mktemp -d)"

          if [[ -n "${SOURCE_ASSET}" ]]; then
            echo "Downloading explicitly selected source asset: ${SOURCE_ASSET}"
            gh release download "${SOURCE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "${SOURCE_ASSET}" \
              --dir "${download_dir}"

            shopt -s nullglob
            explicit_zips=("${download_dir}"/*.zip)
            shopt -u nullglob

            if [[ ${#explicit_zips[@]} -ne 1 ]]; then
              echo "Expected exactly one ZIP for source_asset='${SOURCE_ASSET}', found ${#explicit_zips[@]}." >&2
              exit 1
            fi
            cp -f "${explicit_zips[0]}" "${download_dir}/selected-source.zip"
          else
            echo "Auto-detecting source ZIP from release '${SOURCE_TAG}'..."
            gh release download "${SOURCE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "*.zip" \
              --dir "${download_dir}"

            shopt -s nullglob
            all_zips=("${download_dir}"/*.zip)
            shopt -u nullglob

            source_zips=()
            for zip in "${all_zips[@]}"; do
              base="$(basename "$zip")"
              if [[ "$base" =~ [Ss]ource|[Ss]rc ]]; then
                source_zips+=("$zip")
              fi
            done

            if [[ ${#source_zips[@]} -eq 1 ]]; then
              cp -f "${source_zips[0]}" "${download_dir}/selected-source.zip"
            elif [[ ${#all_zips[@]} -eq 1 ]]; then
              cp -f "${all_zips[0]}" "${download_dir}/selected-source.zip"
            else
              echo "Could not uniquely identify the source ZIP on release '${SOURCE_TAG}'." >&2
              echo "ZIP assets found:" >&2
              printf ' - %s\n' "${all_zips[@]##*/}" >&2
              echo "Set the workflow_dispatch input 'source_asset' to the exact source ZIP name." >&2
              exit 1
            fi
          fi

          test -s "${download_dir}/selected-source.zip" || {
            echo "Source ZIP was not downloaded." >&2
            exit 1
          }

          extract_dir="$(mktemp -d)"
          unzip -q "${download_dir}/selected-source.zip" -d "${extract_dir}"

          shopt -s nullglob dotglob
          entries=("${extract_dir}"/*)
          shopt -u nullglob dotglob

          if [[ ${#entries[@]} -eq 1 && -d "${entries[0]}" ]]; then
            extract_dir="${entries[0]}"
          fi

          rm -rf "${extract_dir}/.github"
          cp -a "${extract_dir}/." "${GITHUB_WORKSPACE}/"

          if [[ ! -f "${GITHUB_WORKSPACE}/settings.gradle.kts" && ! -f "${GITHUB_WORKSPACE}/settings.gradle" ]]; then
            echo "No settings.gradle(.kts) found at the project root after extracting the release source." >&2
            echo "The ZIP must contain the Android project itself (possibly inside one top-level folder)." >&2
            exit 1
          fi

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          if sdkmanager --list | grep -q '^  platforms;android-37\.0'; then
            sdkmanager "platforms;android-37.0"
          else
            sdkmanager "platforms;android-37"
          fi
          sdkmanager "build-tools;36.0.0"

      - name: Generate standard Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon wrapper \
            --gradle-version "${GRADLE_VERSION}" \
            --distribution-type bin
          chmod +x ./gradlew

      - name: Test, lint, and build release APK
        env:
          EASTLY_VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          EASTLY_VERSION_CODE: ${{ steps.meta.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --no-daemon --stacktrace \
            clean test lintDebug assembleRelease \
            -PeastlyVersionName="${EASTLY_VERSION_NAME}" \
            -PeastlyVersionCode="${EASTLY_VERSION_CODE}"

      - name: Verify APK metadata
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"

          BADGING="$($AAPT dump badging "$APK")"
          echo "$BADGING" | grep -F "versionCode='${{ steps.meta.outputs.version_code }}'"
          echo "$BADGING" | grep -F "versionName='${{ steps.meta.outputs.version_name }}'"

          sha256sum "$APK" | tee "${APK}.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eastly-${{ steps.meta.outputs.version_name }}-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error

      - name: Publish release only for a tag release run
        if: steps.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.meta.outputs.release_title }}
          SOURCE_TAG: ${{ steps.meta.outputs.source_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${RELEASE_TITLE}" \
              --notes "Rebuilt by workflow run ${GITHUB_RUN_NUMBER} from source release ${SOURCE_TAG}."

            gh release upload "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              app/build/outputs/apk/release/app-release.apk \
              app/build/outputs/apk/release/app-release.apk.sha256 \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              app/build/outputs/apk/release/app-release.apk \
              app/build/outputs/apk/release/app-release.apk.sha256 \
              --title "${RELEASE_TITLE}" \
              --generate-notes
          fi
